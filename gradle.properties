# Project-wide Gradle settings.
# JVM arguments: Optimized for modern development
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Dsun.zip.disableMemoryMapping=true -Dsun.io.useCanonCaches=false

# Enable VFS watching (Standard)
org.gradle.vfs.watch=true

# Enable configuration cache for faster task execution
org.gradle.configuration-cache=true

# Enable the daemon
org.gradle.daemon=true

# Enable parallel builds
org.gradle.parallel=true
org.gradle.workers.max=4

# Kotlin specific settings
kotlin.compiler.execution.strategy=daemon
kotlin.incremental=true

# AGP settings
android.nonTransitiveRClass=true
android.useAndroidX=true
